<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SHIFT</title>
    <style>
      :root { --ink: #f4eedd; --dim0: #c9a36b; --dim1: #7f8cff; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0b0a0e; overflow: hidden; color: var(--ink);
        font: 600 15px/1.4 ui-monospace, "Cascadia Mono", Consolas, "Microsoft JhengHei", monospace; }
      #game { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; }
      .hud { position: absolute; left: 0; right: 0; pointer-events: none; display: flex; gap: 10px; padding: 12px 16px; align-items: center;
        text-shadow: 2px 2px 0 #000; }
      .top { top: 0; }
      .bottom { bottom: 0; justify-content: center; }
      .badge { padding: 2px 10px; border: 2px solid currentColor; background: #0008; }
      .dim0 { color: var(--dim0); } .dim1 { color: var(--dim1); }
      .spacer { flex: 1; }
      #cores { color: #7ff0ff; } #rewards { color: #f2c94c; }
      #hint { background: #0009; padding: 4px 12px; }
      #hint b { color: #7ff0ff; } #hint .off { color: #8a8494; }
      #toast { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); background: #000b; padding: 6px 16px;
        opacity: 0; transition: opacity .2s; pointer-events: none; }
      #toast.show { opacity: 1; }
      #overlay { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: #000a; }
      #overlay.hidden { display: none; }
      #overlay-title { font-size: 44px; letter-spacing: 4px; text-shadow: 4px 4px 0 #000; }
      #overlay.caught #overlay-title { color: #ff5d5d; }
      #overlay.won #overlay-title { color: #c46bff; }
      a.editor { pointer-events: auto; color: var(--ink); opacity: .6; }
      .keys { position: absolute; right: 16px; top: 44px; font-size: 12px; opacity: .55; text-align: right; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div class="hud top">
      <span id="level-name"></span>
      <span id="dim" class="badge"></span>
      <span class="spacer"></span>
      <span id="cores"></span>
      <span id="rewards"></span>
      <a class="editor" href="./editor.html">編輯器</a>
    </div>
    <div class="hud bottom"><span id="hint"></span></div>
    <div class="keys">WASD 移動・滑鼠左右 / ←→ 轉視角・滑鼠上下 調俯仰（點畫面鎖定滑鼠）・滾輪 / +− 縮放・Shift 按住潛行 / 輕點轉移・E 互動・Space 揮劍・R 重來</div>
    <div id="toast"></div>
    <div id="overlay" class="hidden"><div id="overlay-title"></div><div id="overlay-sub"></div></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
