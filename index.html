<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SHIFT</title>
    <style>
      /* Fusion Pixel 10px (SIL OFL 1.1, public/fonts/fusion-pixel-OFL.txt): sizes stay whole multiples of 10px so every
         font pixel lands on whole screen pixels */
      @font-face { font-family: "Fusion Pixel 10px"; src: url("/fonts/fusion-pixel-10px-proportional-zh_tw.woff2") format("woff2");
        font-display: block; }
      :root { --ink: #f4eedd; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0b0a0e; overflow: hidden; color: var(--ink);
        font: 400 20px/1.4 "Fusion Pixel 10px", monospace; -webkit-font-smoothing: none; -moz-osx-font-smoothing: grayscale;
        font-synthesis: none; }
      #game { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; }
      a.editor { position: absolute; top: 12px; right: 16px; color: var(--ink); opacity: .6; text-shadow: 2px 2px 0 #000; }
      #fade { position: absolute; inset: 0; background: #0b0a0e; opacity: 0; pointer-events: none; }
      #briefing { position: absolute; inset: 0; pointer-events: none; text-shadow: 2px 2px 0 #000; }
      #briefing[hidden] { display: none; }
      #briefing .page[hidden] { display: none; }
      /* --k (set by src/render/briefing.ts) shrinks every label in proportion when the screen is too small for them */
      #briefing .station { position: absolute; transform: translateX(-50%) scale(var(--k, 1)); transform-origin: 50% 0;
        text-align: center; white-space: nowrap; }
      #briefing .station.side { transform: translateY(-50%) scale(var(--k, 1)); transform-origin: 0 50%; text-align: left; }
      #briefing .how { display: block; margin-top: 6px; opacity: .8; font-size: 20px; }
      #briefing .pair { display: flex; gap: 40px; justify-content: center; }
      #briefing kbd { display: inline-block; min-width: 2.4em; padding: 3px 10px 5px; font: inherit; color: #22160a;
        background: var(--ink); border-radius: 3px; box-shadow: inset 0 -3px 0 #b8a88a, 2px 2px 0 #000; text-shadow: none; }
      #briefing .start { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; opacity: .75;
        transform: scale(var(--k, 1)); transform-origin: 50% 100%; animation: blink 1.2s steps(2, jump-none) infinite; }
      @keyframes blink { 50% { opacity: .25; } }
      #ending { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center;
        gap: 15px; pointer-events: none; text-shadow: 4px 4px 0 #000; white-space: nowrap; }
      #ending[hidden] { display: none; }
      #ending span { opacity: 0; transition: opacity .9s ease-out; }
      #ending span.in { opacity: 1; }
      #ending .escaped { font-size: 60px; letter-spacing: 6px; }
      #ending .thanks { font-size: 30px; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="briefing" hidden>
      <div class="page">
        <div class="station"><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd><span class="how">Move</span></div>
      </div>
      <div class="page" hidden>
        <div class="station"><kbd>Space</kbd><span class="pair"><span class="how">Ambush the Troll</span><span class="how">Toggle the Lever</span></span></div>
      </div>
      <div class="page" hidden>
        <div class="station side"><kbd>Shift</kbd><span class="how">Press to SHIFT</span><span class="how">Hold to Sneak</span></div>
      </div>
      <div class="start">Press to Continue</div>
    </div>
    <div id="ending" hidden><span class="escaped">ESCAPED</span><span class="thanks">thanks for playing</span></div>
    <div id="fade"></div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
